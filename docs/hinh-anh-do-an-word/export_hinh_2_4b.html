<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: 'Be Vietnam Pro', -apple-system, Arial, sans-serif;
    display: inline-block;
  }
  svg {
    display: block;
    background: #ffffff;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1100 580" width="1100" height="580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- TÁC NHÂN -->
  <rect x="30" y="70" width="160" height="50" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="100" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">KHÁCH HÀNG</text>

  <rect x="910" y="240" width="160" height="50" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="990" y="270" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">KỸ THUẬT VIÊN (KTV)</text>

  <rect x="30" y="440" width="160" height="50" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="470" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">THU NGÂN / POS</text>

  <!-- CÁC TIẾN TRÌNH CON 4.1, 4.2, 4.3 -->
  <!-- 4.1 -->
  <rect x="290" y="65" width="230" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="290" y1="90" x2="520" y2="90" stroke="#d97706" stroke-width="1.2"/>
  <text x="405" y="82" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">4.1</text>
  <text x="405" y="108" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Đặt lịch &amp; Điều phối bàn nâng</text>

  <!-- 4.2 -->
  <rect x="290" y="240" width="230" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="290" y1="265" x2="520" y2="265" stroke="#d97706" stroke-width="1.2"/>
  <text x="405" y="258" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">4.2</text>
  <text x="405" y="283" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Thẩm định KT &amp; Sổ BH điện tử</text>

  <!-- 4.3 -->
  <rect x="290" y="435" width="230" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="290" y1="460" x2="520" y2="460" stroke="#d97706" stroke-width="1.2"/>
  <text x="405" y="452" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">4.3</text>
  <text x="405" y="478" font-size="12.5" font-weight="bold" fill="#78350f" text-anchor="middle">Nghiệm thu xe &amp; Xuất hóa đơn</text>

  <!-- KHO DỮ LIỆU LIÊN QUAN -->
  <!-- D2: Xe khách hàng -->
  <g>
    <rect x="630" y="70" width="220" height="46" fill="#dcfce7" stroke="none"/>
    <line x1="630" y1="70" x2="850" y2="70" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="630" y1="116" x2="850" y2="116" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="670" y1="70" x2="670" y2="116" stroke="#16a34a" stroke-width="1.5"/>
    <text x="650" y="98" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">D2</text>
    <text x="760" y="98" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">XE KHÁCH HÀNG (ODO/CÀ VẸT)</text>
  </g>

  <!-- D5: Lịch hẹn & Phiếu DV -->
  <g>
    <rect x="630" y="245" width="220" height="46" fill="#dcfce7" stroke="none"/>
    <line x1="630" y1="245" x2="850" y2="245" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="630" y1="291" x2="850" y2="291" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="670" y1="245" x2="670" y2="291" stroke="#16a34a" stroke-width="1.5"/>
    <text x="650" y="273" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">D5</text>
    <text x="760" y="273" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">LỊCH HẸN &amp; PHIẾU DỊCH VỤ</text>
  </g>

  <!-- D6: Sổ bảo hành chính hãng -->
  <g>
    <rect x="630" y="440" width="220" height="46" fill="#dcfce7" stroke="none"/>
    <line x1="630" y1="440" x2="850" y2="440" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="630" y1="486" x2="850" y2="486" stroke="#16a34a" stroke-width="2.5"/>
    <line x1="670" y1="440" x2="670" y2="486" stroke="#16a34a" stroke-width="1.5"/>
    <text x="650" y="468" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">D6</text>
    <text x="760" y="468" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">SỔ BẢO HÀNH CHÍNH HÃNG</text>
  </g>

  <!-- CÁC LUỒNG MŨI TÊN -->
  <!-- KH -> 4.1 -->
  <line x1="190" y1="95" x2="285" y2="95" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="238" y="85" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Chọn giờ hẹn &amp; Xe</text>

  <!-- 4.1 <-> D2 -->
  <line x1="520" y1="95" x2="625" y2="95" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="575" y="85" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Đối soát Biển số/ODO</text>

  <!-- 4.1 -> D5 -->
  <path d="M 460 125 C 460 180, 630 200, 630 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="530" y="170" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Phân bổ Bàn nâng KTV</text>

  <!-- KTV <-> 4.2 -->
  <line x1="910" y1="265" x2="525" y2="265" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="720" y="255" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Cập nhật kiểm tra &amp; phụ tùng hỏng</text>

  <!-- 4.2 <-> D6 -->
  <path d="M 450 300 C 450 380, 630 380, 630 440" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="530" y="360" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Thẩm định điều kiện BH 0đ</text>

  <!-- 4.3 <-> D5 -->
  <path d="M 450 435 C 450 350, 630 350, 630 295" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="530" y="390" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Tính tiền công thợ + phụ tùng</text>

  <!-- 4.3 -> Thu ngân -->
  <line x1="290" y1="465" x2="195" y2="465" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="242" y="455" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Hóa đơn thanh toán</text>

  <!-- 4.3 -> D2 (Cập nhật ODO) -->
  <path d="M 405 495 C 405 540, 870 540, 870 116" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="640" y="530" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Cập nhật ODO xe &amp; Lịch sử dịch vụ mới nhất</text>

  <!-- Chân nhãn giáo trình chuẩn -->
  <text x="550" y="555" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Hình 2.4B: Sơ đồ luồng dữ liệu (DFD) mức dưới đỉnh - Phân hệ 4.0 Quản lý Dịch vụ Kỹ thuật Xưởng</text>
</svg>
</body>
</html>
