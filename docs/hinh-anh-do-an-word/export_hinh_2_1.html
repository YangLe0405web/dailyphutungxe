<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: 'Be Vietnam Pro', -apple-system, Arial, sans-serif;
    display: inline-block;
  }
  svg {
    display: block;
    background: #ffffff;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1320 680" width="1320" height="680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- NÚT GỐC MỨC 0 -->
  <g filter="url(#shadow)">

    <text x="660" y="63" font-size="12" fill="#bfdbfe" text-anchor="middle">(Mức 0 - Business Function Diagram)</text>
  </g>

  <line x1="660" y1="78" x2="660" y2="120" stroke="#475569" stroke-width="2"/>

  </g>

  <rect x="40" y="298" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>

  <text x="130" y="331" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Kỹ thuật viên (KTV)</text>

  <rect x="305" y="298" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>

  <rect x="305" y="438" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>

  <text x="395" y="471" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Tiếp nhận khiếu nại</text>

  <text x="660" y="261" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Bảng giá niêm yết</text>

  <text x="660" y="456" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">3.4 Bàn giao xe &amp; Duyệt</text>
  <text x="660" y="471" font-size="10.5" fill="#2563eb" text-anchor="middle">nhận xe qua mã QR</text>

    <rect x="820" y="150" width="210" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="925" y="172" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">4.0 DỊCH VỤ KỸ THUẬT</text>
    <text x="925" y="190" font-size="12" fill="#92400e" text-anchor="middle">&amp; HẬU MÃI XƯỞNG</text>
  </g>
  <!-- Các con cột 4 -->

  <text x="925" y="331" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Bàn nâng KTV</text>

  <rect x="835" y="368" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>

  <text x="925" y="401" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Sổ bảo hành điện tử</text>

  <rect x="835" y="438" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="925" y="456" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">4.4 Nghiệm thu xe, Lập</text>
  <text x="925" y="471" font-size="10.5" fill="#2563eb" text-anchor="middle">báo giá &amp; Hóa đơn DV</text>

  <!-- CỘT 5: 5.0 BÁO CÁO & PHÂN TÍCH QUẢN TRỊ -->
  <line x1="1190" y1="120" x2="1190" y2="150" stroke="#475569" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="1085" y="150" width="210" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1190" y="172" font-size="13" font-weight="bold" fill="#78350f" text-anchor="middle">5.0 BÁO CÁO &amp; THỐNG KÊ</text>
    <text x="1190" y="190" font-size="12" fill="#92400e" text-anchor="middle">PHÂN TÍCH QUẢN TRỊ</text>
  </g>
  <!-- Các con cột 5 -->
  <line x1="1190" y1="202" x2="1190" y2="440" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1100" y="228" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="1190" y="246" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">5.1 Thống kê doanh thu</text>
  <text x="1190" y="261" font-size="10.5" fill="#2563eb" text-anchor="middle">(Xe mới, Phụ tùng, Dịch vụ)</text>

  <rect x="1100" y="298" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="1190" y="316" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">5.2 Phân tích dòng xe bán chạy</text>
  <text x="1190" y="331" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Hiệu suất chốt cọc</text>

  <rect x="1100" y="368" width="180" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="1190" y="386" font-size="11.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">5.3 Báo cáo tiếp đón xưởng</text>
  <text x="1190" y="401" font-size="10.5" fill="#2563eb" text-anchor="middle">&amp; Chỉ số CSAT hài lòng</text>

  <text x="660" y="580" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Hình 2.1: Sơ đồ phân cấp chức năng (BFD) mức 2 - Hệ thống MotoShop CRM</text>
