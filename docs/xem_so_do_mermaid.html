    .ctrl-btn {

      padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: bold;

    let currentIdx = 0;

    async function switchTab(idx) {
      currentIdx = idx;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      const d = diagrams[idx];
      document.getElementById('desc-target').innerHTML = `<strong>${d.title}</strong><br/>${d.desc}`;
      
      const target = document.getElementById('diagram-target');
      target.removeAttribute('data-processed');
      target.innerHTML = '';
      
      const { svg } = await mermaid.render('mermaid-svg-' + idx, d.code);
      target.innerHTML = svg;
    }

    function copyCurrentCode() {
      const code = diagrams[currentIdx].code;
      navigator.clipboard.writeText(code).then(() => {
        alert("Đã sao chép mã Mermaid của sơ đồ này vào Clipboard! Bạn có thể dán vào https://mermaid.live hoặc Notion/Word.");
      });
    }

    // Load initial
    switchTab(0);
  </script>
