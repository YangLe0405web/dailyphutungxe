  <text x="550" y="555" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Hình 2.4A: Sơ đồ luồng dữ liệu (DFD) mức dưới đỉnh - Phân hệ 3.0 Quản lý Bán hàng Showroom</text>
